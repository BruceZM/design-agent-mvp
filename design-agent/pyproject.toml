[project]
name = "design-agent"
version = "0.1.0"
description = "Fixed local repository design-to-code MVP"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langgraph>=1.0,<2", "pillow>=11,<13", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-dotenv>=1.0,<2", "httpx[socks]>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
