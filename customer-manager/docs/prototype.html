<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户管理 · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#333;background:#f4f4f4}aside{position:fixed;width:200px;inset:0 auto 0 0;border-right:1px solid #bbb;padding:30px 22px;background:#eee}main{margin-left:200px;padding:40px;max-width:1500px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #888;background:white;border-radius:4px}button{cursor:pointer}h1{margin-top:0}.top{display:flex;justify-content:space-between;align-items:center}.box{background:white;border:1px solid #bbb;margin-top:26px}table{width:100%;border-collapse:collapse}td,th{padding:18px;text-align:left;border-bottom:1px solid #ddd}th{background:#eee}footer{display:flex;gap:16px;padding:20px;align-items:center;justify-content:flex-end}.shade{position:fixed;inset:0;background:#0004}.drawer{position:absolute;right:0;top:0;height:100%;width:460px;background:white;padding:30px;border-left:2px solid #999}.drawer label{display:block;margin:20px 0 6px}.drawer input,.drawer textarea,.drawer select{width:100%}.drawer header{display:flex;justify-content:space-between}small{color:#777}@media(max-width:700px){aside{display:none}main{margin:0;padding:20px}.drawer{width:100%}.optional{display:none}}
</style><aside><strong>客户管理</strong><p>▣ 客户档案</p><small>本地演示 · MVP</small></aside><main><div class="top"><div><small>工作空间 / 客户档案</small><h1>客户档案</h1><p>维护客户信息，记录每一次跟进。</p></div><button onclick="show('新增客户')">＋ 新增客户</button></div><div class="box"><table><thead><tr><th>客户</th><th>公司</th><th>联系方式</th><th>跟进状态</th><th class="optional">最近更新</th><th></th></tr></thead><tbody id="rows"></tbody></table><footer><small>共 24 位客户 · 每页 8 条</small><button>上一页</button><span>1 / 3</span><button>下一页</button></footer></div><p><small>演示数据仅保存在当前浏览器</small></p></main><div class="shade" id="shade" hidden onclick="if(event.target===this)closeDrawer()"><section class="drawer"><header><h2 id="title">客户详情</h2><button aria-label="关闭" onclick="closeDrawer()">×</button></header><p>维护客户基本信息与跟进记录</p><label>客户姓名 *</label><input id="name" placeholder="请输入客户姓名"><label>公司</label><input value="青禾科技"><label>联系电话</label><input value="138 0000 0000"><label>跟进状态</label><select><option>待联系</option><option>跟进中</option><option>已成交</option></select><label>跟进备注</label><textarea rows="4" placeholder="记录客户需求、沟通进展与下一步"></textarea><footer><button onclick="closeDrawer()">取消</button><button onclick="closeDrawer()">保存客户</button></footer></section></div><script>const names=['林若安','陈予川','许知远','周沐晴','沈亦宁','顾言初','唐可欣','陆景行'];document.getElementById('rows').innerHTML=names.map((n,i)=>`<tr><td><button onclick="show('客户详情','${n}')">${n}</button></td><td>${['青禾科技','向野设计','松石贸易'][i%3]}</td><td>138 0000 00${String(i).padStart(2,'0')}</td><td>${['待联系','跟进中','已成交'][i%3]}</td><td class="optional">2026-10-01</td><td><button onclick="show('编辑客户','${n}')">编辑</button></td></tr>`).join('');function show(t,n=''){document.getElementById('title').textContent=t;document.getElementById('name').value=n;document.getElementById('shade').hidden=false}function closeDrawer(){document.getElementById('shade').hidden=true}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()})</script></html>
